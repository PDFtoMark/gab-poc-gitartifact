name: CLA probe
on:
  issue_comment:
    types:
      - created
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Read Allowlist File
        id: read_allowlist
        run: |
          ALLOWLIST="alice,bob,carol"
          echo "allowlist=$ALLOWLIST" >> $GITHUB_OUTPUT
      - name: Check if user is in allowlist
        id: check_allowlist
        run: |
          PR_USER=${{ github.event.pull_request.user.login }}
          echo "PR_USER=[$PR_USER]"
          if [[ "${{ steps.read_allowlist.outputs.allowlist }}" == *"$PR_USER"* ]]; then
            echo "is_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "is_allowed=false" >> $GITHUB_OUTPUT
          fi
      - name: Label PR as CLA Allowlist
        if: ${{ steps.check_allowlist.outputs.is_allowed == 'true' }}
        run: |-
          PR_NUMBER="${{ github.event.issue.number }}"
          ENDPOINT="https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels"
          curl -sS -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" "$ENDPOINT/cla:%20unsigned" || true
          curl -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"labels":["cla: allowlist"]}' $ENDPOINT
      - name: Show result
        if: always()
        run: echo "event=${{ github.event_name }} is_allowed=${{ steps.check_allowlist.outputs.is_allowed }}"
