name: Gate probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Non-collaborator login
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENT_USER_LOGIN/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "stranger perm=[$PERM]"
          if [ "$PERM" = "admin" ] || [ "$PERM" = "maintain" ]; then echo "GATE=TRUE"; else echo "GATE=FALSE"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_USER_LOGIN: some-random-outsider-zz1

      - name: Hostile login string (quoting test)
        run: |
          set -euo pipefail
          rm -f /tmp/pwned_marker
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENT_USER_LOGIN/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "hostile perm=[$PERM]"
          if [ -e /tmp/pwned_marker ]; then echo "INJECTION=YES"; else echo "INJECTION=NO"; fi
          if [ "$PERM" = "admin" ] || [ "$PERM" = "maintain" ]; then echo "GATE=TRUE"; else echo "GATE=FALSE"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_USER_LOGIN: 'x"; touch /tmp/pwned_marker; echo "'

      - name: Owner login (expected admin)
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENT_USER_LOGIN/permission" --jq '.permission' 2>/dev/null || echo "none")
          echo "owner perm=[$PERM]"
          if [ "$PERM" = "admin" ] || [ "$PERM" = "maintain" ]; then echo "GATE=TRUE"; else echo "GATE=FALSE"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_USER_LOGIN: ${{ github.repository_owner }}
